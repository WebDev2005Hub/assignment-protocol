<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Layer Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="app-header">
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
            </svg>
            <h1>Application Layer Protocol Visualizer</h1>
        </div>
        <div class="status-badge" id="global-status">Ready</div>
    </header>

    <main class="dashboard-container">
        <!-- LEFT PANEL: Activity -->
        <section class="panel activity-panel">
            <h2>Activity Selector</h2>
            
            <div class="tabs">
                <button class="tab-btn active" data-target="tab-browsing">Browsing</button>
                <button class="tab-btn" data-target="tab-mail">Mail</button>
                <button class="tab-btn" data-target="tab-streaming">Streaming</button>
            </div>

            <div class="tab-content active" id="tab-browsing">
                <form id="form-browsing">
                    <div class="form-group">
                        <label for="browse-url">URL</label>
                        <div class="input-with-icon">
                            <span class="icon">🔗</span>
                            <input type="url" id="browse-url" value="https://example.com" required placeholder="https://...">
                        </div>
                    </div>
                    <button type="submit" class="action-btn">Visit Page</button>
                </form>
            </div>

            <div class="tab-content" id="tab-mail">
                <form id="form-mail">
                    <div class="form-group">
                        <label for="mail-to">To</label>
                        <input type="email" id="mail-to" value="recipient@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="mail-subject">Subject</label>
                        <input type="text" id="mail-subject" value="Meeting Update" required>
                    </div>
                    <div class="form-group">
                        <label for="mail-body">Body</label>
                        <textarea id="mail-body" rows="4" required>Let's catch up tomorrow.</textarea>
                    </div>
                    <button type="submit" class="action-btn">Send Email</button>
                </form>
            </div>

            <div class="tab-content" id="tab-streaming">
                <form id="form-streaming">
                    <div class="form-group">
                        <label for="stream-quality">Video Quality</label>
                        <select id="stream-quality">
                            <option value="480p">480p (SD)</option>
                            <option value="720p">720p (HD)</option>
                            <option value="1080p" selected>1080p (FHD)</option>
                            <option value="4k">4K (UHD)</option>
                        </select>
                    </div>
                    <div class="stream-actions">
                        <button type="submit" class="action-btn play-btn" id="stream-play-btn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                            Play Stream
                        </button>
                    </div>
                </form>
            </div>

            <div class="activity-log">
                <h3>Activity Log</h3>
                <ul id="log-list">
                    <li><span class="time">--:--:--</span> <span class="msg">System initialized. Waiting for action.</span></li>
                </ul>
            </div>
        </section>

        <!-- RIGHT PANEL: Protocol Visualization -->
        <section class="panel visualizer-panel">
            <div class="visualizer-header">
                <h2>Protocol Visualizer</h2>
                <div class="view-toggle">
                    <button class="toggle-btn active" id="btn-view-app">App Layer</button>
                    <button class="toggle-btn" id="btn-view-transport">Transport</button>
                </div>
                <div class="playback-controls">
                    <button class="ctrl-btn" id="btn-prev" title="Previous Step" disabled>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 20L9 12l10-8v16z"/><path d="M5 19V5"/></svg>
                    </button>
                    <button class="ctrl-btn" id="btn-playpause" title="Play/Pause" disabled>
                        <svg class="icon-play" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    </button>
                    <button class="ctrl-btn" id="btn-next" title="Next Step" disabled>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4l10 8-10 8V4z"/><path d="M19 5v14"/></svg>
                    </button>
                    <button class="ctrl-btn" id="btn-replay" title="Replay" disabled>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                    </button>
                </div>
            </div>

            <div class="visualization-area" id="vis-area">
                <!-- Empty State -->
                <div class="empty-state" id="vis-empty">
                    <div class="pulse-ring"></div>
                    <p>Perform an action on the left to see the protocol exchange here.</p>
                </div>

                <!-- Sequence Diagram Container -->
                <div class="sequence-container hidden" id="sequence-container">
                    <div class="actors">
                        <div class="actor client-actor">
                            <div class="actor-icon">💻</div>
                            <div class="actor-name">Client</div>
                        </div>
                        <div class="actor server-actor">
                            <div class="actor-icon">🖧</div>
                            <div class="actor-name" id="server-name">Server</div>
                        </div>
                    </div>
                    
                    <div class="timeline" id="timeline">
                        <div class="timeline-line client-line"></div>
                        <div class="timeline-line server-line"></div>
                        <!-- Messages will be injected here -->
                    </div>
                </div>
            </div>

            <!-- Detail panel for the current message -->
            <div class="message-details hidden" id="message-details">
                <div class="detail-header">
                    <span class="protocol-badge" id="detail-protocol">HTTP</span>
                    <span id="detail-summary" class="detail-summary">GET Request</span>
                    <div id="detail-flags" class="flags-container"></div>
                </div>
                <div class="detail-body">
                    <div class="detail-col" id="detail-primary-col">
                        <pre><code id="detail-raw">GET / HTTP/1.1...</code></pre>
                    </div>
                    <div class="detail-col hidden" id="detail-transport-meta">
                        <div class="meta-item"><span class="meta-label">Seq:</span> <span id="meta-seq">-</span></div>
                        <div class="meta-item"><span class="meta-label">Ack:</span> <span id="meta-ack">-</span></div>
                        <div class="meta-item"><span class="meta-label">Win:</span> <span id="meta-win">-</span></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="/js/visualizer.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
